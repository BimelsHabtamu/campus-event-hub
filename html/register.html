<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Create an account on Campus Event & Activity Hub.">

  <title>Create account · CampusHub</title>

  <link rel="icon" href="../images/logo/logo.png" type="image/png">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <a class="auth-back auth-back--top" href="index.html">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>

    <span>Back to home</span>
  </a>

  <main class="auth-layout auth-layout--single" aria-label="Create an account">

    <section class="auth-panel">

      <div class="auth-panel-inner">

        <!-- Brand -->
        <a class="auth-brand auth-brand--stack" href="index.html" aria-label="CampusHub home">
          <img class="auth-brand-img" src="../images/logo/logo.png" alt="CampusHub logo" width="64" height="64">

          <span class="auth-brand-name">
            Campus<em>Hub</em>
            
          </span>
        </a>


        <!-- Heading -->
        <header class="auth-heading auth-heading--center">
          <h1>Create your account</h1>
        </header>


        <!-- Registration Form -->
        <form id="register-form" class="auth-form" action="#" method="post" novalidate aria-label="Registration form">

          <!-- Global form message -->
          <div id="reg-message" class="form-message" role="alert" hidden></div>


          <!-- Name -->
          <div class="form-row cols-2">

            <div class="form-field">
              <label class="form-label" for="reg-first">First name</label>
              <input id="reg-first" class="input" type="text" name="firstName" placeholder="Bimels"
                autocomplete="given-name" required>
              <span id="reg-first-error" class="field-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-label" for="reg-last">Last name</label>
              <input id="reg-last" class="input" type="text" name="lastName" placeholder="Habtamu"
                autocomplete="family-name" required>
              <span id="reg-last-error" class="field-error" role="alert" hidden></span>
            </div>

          </div>


          <!-- Email -->
          <div class="form-field">
            <label class="form-label" for="reg-email">email</label>
            <input id="reg-email" class="input" type="email" name="email" placeholder="bimels@gmail.com"
              autocomplete="email" required>
            <span id="reg-email-error" class="field-error" role="alert" hidden></span>
          </div>


          <!-- Password -->
          <div class="form-row cols-2">

            <div class="form-field">
              <label class="form-label" for="reg-password">Password</label>
              <input id="reg-password" class="input" type="password" name="password"
                placeholder="8+ chars, a letter &amp; a number" autocomplete="new-password" minlength="8" required>
              <span id="reg-password-error" class="field-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-label" for="reg-confirm">Confirm password</label>
              <input id="reg-confirm" class="input" type="password" name="confirm" placeholder="Repeat password"
                autocomplete="new-password" minlength="8" required>
              <span id="reg-confirm-error" class="field-error" role="alert" hidden></span>
            </div>

          </div>


          <!-- Terms -->
          <label class="form-check" for="reg-terms">
            <input id="reg-terms" type="checkbox" name="terms" required>
            <span>
              I agree to the
              <a href="#" aria-disabled="true">Terms of Service</a> and
              <a href="#" aria-disabled="true">Privacy Policy</a>.
            </span>
          </label>
          <span id="reg-terms-error" class="field-error" role="alert" hidden></span>


          <!-- Submit -->
          <button id="reg-submit" class="btn btn-primary btn-lg btn-block" type="submit">
            Create account
          </button>

        </form>


        <!-- Login -->
        <div class="auth-switch">

          <span>Already have an account?</span>

          <a href="login.html">
            Log in
          </a>

        </div>

      </div>

    </section>

  </main>

  <script type="module" src="../js/register.js"></script>

</body>

</html>
