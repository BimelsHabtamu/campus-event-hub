<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Sign in to CampusHub and discover, save, and register for campus events.">

  <title>Sign in · CampusHub</title>

  <link rel="icon" href="../images/logo/logo.png" type="image/png">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

  <a class="auth-back auth-back--top" href="index.html">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>

    <span>Back to home</span>
  </a>

  <main class="auth-layout auth-layout--single" aria-label="Sign in to CampusHub">

    <section class="auth-panel">

      <div class="auth-panel-inner">

        <!-- Brand -->
        <a class="auth-brand auth-brand--stack" href="index.html" aria-label="CampusHub home">
          <img class="auth-brand-img" src="../images/logo/logo.png" alt="CampusHub logo" width="64" height="64">

          <span class="auth-brand-name">
            Campus<em>Hub</em>
          </span>
        </a>


        <!-- Heading -->
        <header class="auth-heading auth-heading--center">
          <h1>Welcome back</h1>

          <p>Sign in to continue to your campus dashboard.</p>
        </header>


        <!-- Login Form -->
        <form id="login-form" class="auth-form" action="#" method="post" novalidate aria-label="Login form">

          <!-- Global form message -->
          <div id="login-message" class="form-message" role="alert" hidden></div>


          <!-- Email -->
          <div class="form-field">

            <label class="form-label" for="login-email">
              University email
            </label>

            <div class="auth-input-wrap">

              <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                <path d="m3 7 9 6 9-6"></path>
              </svg>

              <input id="login-email" class="input auth-input" type="email" name="email"
                placeholder="you@university.edu" autocomplete="email" required>

            </div>

            <span id="login-email-error" class="field-error" role="alert" hidden></span>

          </div>


          <!-- Password -->
          <div class="form-field">

            <label class="form-label" for="login-password">
              Password
            </label>

            <div class="auth-input-wrap">

              <svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                stroke-width="1.8">
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>

                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>

              <input id="login-password" class="input auth-input" type="password" name="password"
                placeholder="Enter your password" autocomplete="current-password" required>

            </div>

            <span id="login-password-error" class="field-error" role="alert" hidden></span>

          </div>


          <!-- Submit -->
          <button id="login-submit" class="btn btn-primary btn-lg btn-block auth-submit" type="submit">
            Sign in
          </button>

        </form>


        <!-- Register -->
        <div class="auth-switch">

          <span>Don't have an account?</span>

          <a href="register.html">
            Create one
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- Existing authentication logic -->
  <script type="module" src="../js/login.js"></script>

</body>

</html>
